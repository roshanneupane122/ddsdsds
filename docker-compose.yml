services:
  db:
    image: postgis/postgis:16-3.4
    container_name: nepal_gis_db
    restart: always
    env_file:
      - ./catalyst-project/.env
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: nepal_opportunity_map
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nepal_opportunity_map"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./catalyst-project
    container_name: fastapi_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./catalyst-project/.env
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: nepal_opportunity_map
      POSTGRES_SERVER: db
      POSTGRES_PORT: 5432
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"
    volumes:
      - ./catalyst-project:/app

  ml:
    build: ./Ml
    container_name: ml_service
    restart: always
    ports:
      - "8001:8000"
    volumes:
      - ./Ml:/app

  frontend:
    build: ./nepal-opportunity-map
    container_name: react_frontend
    restart: always
    depends_on:
      - backend
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    ports:
      - "5173:5173"
    volumes:
      - ./nepal-opportunity-map:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0


volumes:
  postgres_data: