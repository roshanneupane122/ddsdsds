services:
  db:
    image: postgis/postgis:16-3.4
    container_name: nepal_gis_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: jaynepal
      POSTGRES_DB: nepal_opportunity_map
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./catalyst-project
    container_name: fastapi_backend
    depends_on:
      - db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: jaynepal
      POSTGRES_DB: nepal_opportunity_map
      POSTGRES_SERVER: db
      POSTGRES_PORT: 5432
      SECRET_KEY: change-this-to-a-real-secret-key
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
    ports:
      - "8000:8000"
    volumes:
      - ./catalyst-project:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build: ./nepal-opportunity-map
    container_name: react_frontend
    depends_on:
      - backend
    ports:
      - "5173:5173"
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    volumes:
      - ./nepal-opportunity-map:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0


volumes:
  postgres_data: