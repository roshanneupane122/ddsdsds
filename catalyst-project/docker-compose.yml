version: "3.8"

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: nepal_gis_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: jaynepal
      POSTGRES_DB: nepal_opportunity_map
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: .
    container_name: fastapi_backend
    depends_on:
      - db
    ports:
      - "8000:8000"

volumes:
  postgres_data: